<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BMM - Business Manual Manager</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- HTMX / _hyperscript / Alpine.js / Vue.js -->
  <script src="https://unpkg.com/htmx.org@2.0.6"></script>
  <script src="https://unpkg.com/hyperscript.org@0.9.14"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

  <!-- PyScript -->
  <link rel="stylesheet" href="https://pyscript.net/releases/2025.2.3/core.css">
  <script type="module" src="https://pyscript.net/releases/2025.2.3/core.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    body { background: #f8fafc; }
    .glass { background: rgba(255,255,255,.86); backdrop-filter: blur(12px); }
  </style>
</head>

<body class="min-h-screen text-slate-900" x-data="bmmApp()" x-init="init()" x-cloak>
<header class="sticky top-0 z-20 border-b bg-white/90 backdrop-blur">
  <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4">
    <div>
      <p class="text-xs font-semibold uppercase tracking-[.25em] text-indigo-600">BMM</p>
      <h1 class="text-xl font-bold">Business Manual Manager</h1>
    </div>
    <div class="flex items-center gap-2">
      <button @click="toggleLang()" class="rounded-lg border px-3 py-2 text-sm hover:bg-slate-50"
              :aria-label="lang === 'ja' ? 'Switch to English' : '日本語に切り替え'">
        <span x-text="lang === 'ja' ? '日本語 / English' : 'English / 日本語'"></span>
      </button>
      <button @click="openCreate()" class="rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow hover:bg-indigo-700"
              x-text="t('new')"></button>
    </div>
  </div>
</header>

<main class="mx-auto grid max-w-7xl gap-6 px-4 py-6 lg:grid-cols-[360px_1fr]">
  <aside class="glass rounded-2xl border p-4 shadow-sm">
    <div class="mb-4 flex items-center justify-between">
      <h2 class="font-bold" x-text="t('manuals')"></h2>
      <span class="rounded-full bg-slate-100 px-2 py-1 text-xs" x-text="manuals.length"></span>
    </div>
    <input x-model="query" type="search"
           class="mb-4 w-full rounded-xl border px-3 py-2 outline-none ring-indigo-200 focus:ring"
           :placeholder="t('search')">
    <div class="space-y-2">
      <template x-for="m in filteredManuals()" :key="m.id">
        <button @click="select(m.id)"
          class="w-full rounded-xl border p-3 text-left transition hover:border-indigo-300 hover:bg-indigo-50"
          :class="selectedId === m.id ? 'border-indigo-500 bg-indigo-50' : 'bg-white'">
          <div class="font-semibold" x-text="m.title"></div>
          <div class="mt-1 text-xs text-slate-500">
            <span x-text="m.category"></span> · <span x-text="m.updated"></span>
          </div>
        </button>
      </template>
      <div x-show="filteredManuals().length === 0" class="rounded-xl border border-dashed p-6 text-center text-sm text-slate-500"
           x-text="t('empty')"></div>
    </div>
  </aside>

  <section class="glass min-h-[620px] rounded-2xl border shadow-sm">
    <template x-if="selected()">
      <article class="p-6 md:p-8">
        <div class="flex flex-col justify-between gap-4 md:flex-row md:items-start">
          <div>
            <div class="mb-2 flex gap-2 text-xs">
              <span class="rounded-full bg-indigo-100 px-2 py-1 font-semibold text-indigo-700" x-text="selected().category"></span>
              <span class="rounded-full bg-slate-100 px-2 py-1" x-text="selected().updated"></span>
            </div>
            <h2 class="text-3xl font-black tracking-tight" x-text="selected().title"></h2>
          </div>
          <div class="flex gap-2">
            <button @click="openEdit()" class="rounded-lg border px-3 py-2 text-sm hover:bg-slate-50" x-text="t('edit')"></button>
            <button @click="remove()" class="rounded-lg bg-rose-600 px-3 py-2 text-sm font-semibold text-white hover:bg-rose-700" x-text="t('delete')"></button>
          </div>
        </div>
        <div class="mt-8 whitespace-pre-wrap rounded-2xl bg-slate-50 p-5 leading-8" x-text="selected().body"></div>
      </article>
    </template>
    <div x-show="!selected()" class="flex min-h-[620px] items-center justify-center p-10 text-center text-slate-500">
      <div>
        <div class="mx-auto mb-4 grid h-16 w-16 place-items-center rounded-2xl bg-indigo-100 text-2xl">📘</div>
        <p class="font-semibold" x-text="t('select')"></p>
        <button @click="openCreate()" class="mt-4 rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white" x-text="t('new')"></button>
      </div>
    </div>
  </section>
</main>

<!-- CRUD modal -->
<div x-show="modalOpen" @keydown.escape.window="modalOpen=false"
     class="fixed inset-0 z-30 grid place-items-center bg-slate-950/50 p-4">
  <form @submit.prevent="save()" class="w-full max-w-2xl rounded-2xl bg-white p-6 shadow-2xl">
    <div class="mb-5 flex items-center justify-between">
      <h2 class="text-xl font-bold" x-text="editingId ? t('edit') : t('new')"></h2>
      <button type="button" @click="modalOpen=false" class="text-2xl text-slate-400">×</button>
    </div>
    <label class="block text-sm font-semibold" x-text="t('title')"></label>
    <input x-model="form.title" required class="mt-1 mb-4 w-full rounded-xl border px-3 py-2">
    <label class="block text-sm font-semibold" x-text="t('category')"></label>
    <input x-model="form.category" required class="mt-1 mb-4 w-full rounded-xl border px-3 py-2">
    <label class="block text-sm font-semibold" x-text="t('body')"></label>
    <textarea x-model="form.body" required rows="12" class="mt-1 w-full rounded-xl border px-3 py-2"></textarea>
    <div class="mt-5 flex justify-end gap-2">
      <button type="button" @click="modalOpen=false" class="rounded-lg border px-4 py-2" x-text="t('cancel')"></button>
      <button class="rounded-lg bg-indigo-600 px-4 py-2 font-semibold text-white" x-text="t('save')"></button>
    </div>
  </form>
</div>

<!-- HTMX + hyperscript demonstration: no server request is required for CRUD -->
<div class="mx-auto max-w-7xl px-4 pb-8 text-xs text-slate-400">
  <span hx-get="data:text/plain,BMM" hx-trigger="none">HTMX enabled</span>
  <span _="on click toggle .hidden on me"> · _hyperscript enabled</span>
  <span class="ml-2">Alpine.js / Vue.js / TypeScript / PyScript progressive-enhancement stack</span>
</div>

<script type="text/typescript">
/*
  TypeScript reference module.
  The production browser logic is mirrored in plain JavaScript below so the
  static HTML works without a TypeScript build step on Vercel.
*/
type Manual = {
  id: string;
  title: string;
  category: string;
  body: string;
  updated: string;
};
</script>

<script>
const BMM_STORAGE = "bmm-manuals-v1";

function bmmApp() {
  return {
    lang: "ja",
    query: "",
    manuals: [],
    selectedId: null,
    modalOpen: false,
    editingId: null,
    form: { title: "", category: "", body: "" },

    dict: {
      ja: {
        new: "新規作成", edit: "編集", delete: "削除", manuals: "業務マニュアル",
        search: "タイトル・カテゴリを検索", empty: "マニュアルがありません。",
        select: "左側からマニュアルを選択してください。", title: "タイトル",
        category: "カテゴリ", body: "本文", cancel: "キャンセル", save: "保存",
        confirm: "このマニュアルを削除しますか？"
      },
      en: {
        new: "New", edit: "Edit", delete: "Delete", manuals: "Business Manuals",
        search: "Search title or category", empty: "No manuals.",
        select: "Select a manual from the left.", title: "Title",
        category: "Category", body: "Content", cancel: "Cancel", save: "Save",
        confirm: "Delete this manual?"
      }
    },

    init() {
      const raw = localStorage.getItem(BMM_STORAGE);
      this.manuals = raw ? JSON.parse(raw) : [
        {id:"demo-1", title:"新入社員オンボーディング", category:"人事",
         body:"1. アカウントを作成\n2. 就業規則を確認\n3. チームへ挨拶",
         updated:"2026-08-10"},
        {id:"demo-2", title:"Daily Opening Checklist", category:"Operations",
         body:"1. Check systems\n2. Review tasks\n3. Confirm safety",
         updated:"2026-08-10"}
      ];
      this.persist();
      if (this.manuals.length) this.selectedId = this.manuals[0].id;
    },

    t(key) { return this.dict[this.lang][key] || key; },
    toggleLang() { this.lang = this.lang === "ja" ? "en" : "ja"; },

    filteredManuals() {
      const q = this.query.trim().toLowerCase();
      return q ? this.manuals.filter(m =>
        `${m.title} ${m.category} ${m.body}`.toLowerCase().includes(q)
      ) : this.manuals;
    },

    select(id) { this.selectedId = id; },
    selected() { return this.manuals.find(m => m.id === this.selectedId) || null; },

    openCreate() {
      this.editingId = null;
      this.form = { title: "", category: "", body: "" };
      this.modalOpen = true;
    },

    openEdit() {
      const m = this.selected();
      if (!m) return;
      this.editingId = m.id;
      this.form = { title: m.title, category: m.category, body: m.body };
      this.modalOpen = true;
    },

    save() {
      const now = new Date().toISOString().slice(0, 10);
      if (this.editingId) {
        const m = this.manuals.find(x => x.id === this.editingId);
        Object.assign(m, {...this.form, updated: now});
      } else {
        const m = {...this.form, id: crypto.randomUUID(), updated: now};
        this.manuals.unshift(m);
        this.selectedId = m.id;
      }
      this.persist();
      this.modalOpen = false;
    },

    remove() {
      if (!this.selected() || !confirm(this.t("confirm"))) return;
      const id = this.selectedId;
      this.manuals = this.manuals.filter(m => m.id !== id);
      this.selectedId = this.manuals[0]?.id || null;
      this.persist();
    },

    persist() {
      localStorage.setItem(BMM_STORAGE, JSON.stringify(this.manuals));
    }
  };
}
</script>

<!-- PyScript: browser-side Python integration point -->
<py-script>
from datetime import date
print(f"BMM PyScript ready: {date.today().isoformat()}")
</py-script>

</body>
</html>
